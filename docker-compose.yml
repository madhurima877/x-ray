services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  seed:
    image: redis:7.4-alpine
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
    volumes: ["./scripts:/scripts:ro"]
    entrypoint: ["sh", "/scripts/seed.sh"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  ai:
    image: python:3.12-slim
    volumes: ["./ai-service:/app:ro"]
    command: ["python", "/app/server.py"]

  mockrelay:
    build: .
    entrypoint: ["/usr/local/bin/mockrelay"]

  xray:
    build: .
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      kafka: { condition: service_started }
      ai: { condition: service_started }
      mockrelay: { condition: service_started }
    environment:
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: xray.verdicts
      AI_URL: http://ai:8000/score
      WORKERS: "512"
      QUEUE_SIZE: "10000"
    stop_grace_period: 35s
